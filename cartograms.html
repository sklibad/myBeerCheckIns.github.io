<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="ikony/beer.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin=""/>
    <link rel="stylesheet" href="common.css?v=64" />
    <link rel="stylesheet" href="cartogram.css?v=64" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
    <script src="Control.FullScreen.js?v=64"></script>
    <script src="cartogram.js?v=64"></script>
    <script src="place_years.js?v=64"></script>
    <script src="circles.js?v=64"></script>
    <title>Cartograms</title>
    <script src="nav.js?v=64" defer></script>
    <script src="place-window.js?v=64" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a class="logo" href="map4.html" aria-label="MyBeerCheckIns – Check-in Map">
                <span class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M6 6h9v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M15 9h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/><path d="M6 6a2.5 2.5 0 0 1 4.5-1.5A2.5 2.5 0 0 1 15 6"/><path d="M9 10v7M12 10v7"/></svg>
                </span>
                <span class="logo-text">My<span class="logo-accent">Beer</span>CheckIns</span>
            </a>
            <nav class="site-nav" aria-label="Main">
                <a href="map4.html"><span class="nav-long">Check-in Map</span><span class="nav-short">Map</span></a>
                <a href="cartograms.html">Cartograms</a>
                <a href="statistics.html"><span class="nav-long">Statistics</span><span class="nav-short">Stats</span></a>
            </nav>
        </div>
    </header>
    <div id='map'></div>
    <script type="text/javascript">
        // map1–3.js are loaded when their region is shown first
        initCartograms([{
            id: 'prague',
            label: 'Prague',
            script: 'map1.js?v=64',
            setup: function () {
                return {
                    nameProperty: 'NAME_2',
                    fillOpacity: 0.7,
                    areaSets: [{
                        id: 'districts',
                        label: 'Districts',
                        geojson: prague_cartogram,
                        unit: 'per 10 km²',
                        places: { checkIns: pragueVenues, breweries: pragueBreweries }
                    }]
                };
            }
        }, {
            id: 'czechia',
            label: 'Czechia',
            script: 'map2.js?v=64',
            setup: function () {
                return {
                    nameProperty: 'NAME_2',
                    fillOpacity: 0.7,
                    areaSets: [{
                        id: 'regions',
                        label: 'Regions',
                        geojson: kraje,
                        unit: 'per 1 000 km²',
                        places: { checkIns: krajeCheckIns, breweries: krajeBreweries }
                    }, {
                        id: 'districts',
                        label: 'Districts',
                        geojson: okresy,
                        unit: 'per 1 000 km²',
                        places: { checkIns: czechVenues, breweries: czechBreweries },
                        title: function (name) {
                            return name.indexOf('Praha') === 0 ? name : 'Okres ' + name;
                        }
                    }]
                };
            }
        }, {
            id: 'world',
            label: 'World',
            script: 'map3.js?v=64',
            // the whole world on large screens; on phones it would be tiny, so Europe,
            // where most of the check-ins are
            view: function (small) {
                return small ? { bounds: [[36, -10], [60, 30]] } : { center: [30, 25], zoom: 2 };
            },
            setup: function () {
                return {
                    nameProperty: 'ADMIN',
                    fillOpacity: 1,
                    areaSets: [{
                        id: 'countries',
                        label: 'Countries',
                        geojson: countries,
                        unit: 'per 100 000 km²',
                        places: { checkIns: venues, breweries: breweries }
                    }]
                };
            }
        }]);
    </script>
</body>
</html>
