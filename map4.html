    <script type="text/javascript">

        var map = L.map('map', {
                // Finer zoom steps on phones so that fitting all markers does not fall back to zoom 0
                zoomSnap: isSmallScreen() ? 0.25 : 1,
                zoomControl: false
            }
        ).setView([40, 0], 2);

        var OSmap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> | <a href="https://www.linkedin.com/in/david-skliba/?locale=en_US" target="_blank">David Šklíba</a>',
            opacity: 0.75
        }).addTo(map);

        var Imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution:'&copy; <a href="https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9" target="_blank">ESRI</a> | <a href="https://www.linkedin.com/in/david-skliba/?locale=en_US" target="_blank">David Šklíba</a>',
            opacity: 0.5
        });

        var TopoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution:'&copy; <a href = "https://opentopomap.org/credits" target = "_blank">OpenTopoMap</a> | <a href="https://www.linkedin.com/in/david-skliba/?locale=en_US" target="_blank">David Šklíba</a>',
            opacity: 0.5
        });
        /*-----------------------------------------------------------------------------------------------------------------------------------------------------------*/
        var selectedLayer = "Venues"; // default layer, first in the switch
        function onEachLayer(feature, layer, selectedLayer) {
            // Assuming brewery_check_ins is a dictionary with brewery IDs as keys
            if (selectedLayer === "Breweries"){
                var layerId = feature.properties.Brewery;
                var beerList = brewery_check_ins[layerId];
                var check_ins = brewery_check_ins;
            } else if (selectedLayer === "Venues"){
                var layerId = feature.properties.Venue;
                var beerList = venue_check_ins[layerId];
                var check_ins = venue_check_ins;
            }

            var beers = check_ins[layerId].map(function (checkIn, i) {
                return { index: i, name: checkIn['Beer'] };
            });

            layer.beerCount = beers.length;
            layer.bindPopup(buildPopupContent(layerId, beers), popupOptions());
        }

        // Popup of a brewery / venue: brown header with the place name, list of beers below
        function buildPopupContent(layerId, beers) {
            var placeName = layerId.replace(/ /g, "_").replace(/"/g, "&quot;");
            var kind = selectedLayer === "Venues" ? "Venue" : "Brewery";
            var countText = beers.length + (beers.length === 1 ? " beer" : " beers");

            var html = "<div class='popup-container'>";
            html += "<div class='popup-header'>";
            html += "<span class='popup-title'>" + layerId + "</span>";
            html += "<span class='popup-subtitle'>" + kind + " &middot; " + countText + "</span>";
            html += "</div>";
            html += "<ul class='popup-list'>";
            beers.forEach(function (beer) {
                html += '<li><a href="#" class="box-content" id="' + placeName + ',' + beer.index + '">' + beer.name + '</a></li>';
            });
            html += "</ul></div>";
            return html;
        }
        
        // Devices without a mouse (phones, tablets) cannot hover
        var isTouchDevice = window.matchMedia('(hover: none)').matches;

        function isSmallScreen() {
            return window.innerWidth <= 1000;
        }

        // Popups never get wider than the screen
        function popupOptions() {
            var maxWidth = Math.min(600, window.innerWidth - 60);
            return {
                maxWidth: maxWidth,
                minWidth: Math.min(isSmallScreen() ? 260 : 200, maxWidth),
                autoPan: false, // centerPopup() moves the map instead
                className: 'beer-popup'
            };
        }

        // Bigger markers on phones and tablets so they are easy to tap
        function markerIcon(iconUrl) {
            var size = isSmallScreen() ? 66 : 50;
            return L.icon({
                iconUrl: iconUrl,
                iconSize: [size, size],
                iconAnchor: [size / 2, size],
                popupAnchor: [0, -size]
            });
        }

        function createClusterGroup() {
            if (!isSmallScreen()) {
                return L.markerClusterGroup();
            }
            // Same look as the default cluster icon, only larger
            return L.markerClusterGroup({
                maxClusterRadius: 60,
                iconCreateFunction: function (cluster) {
                    var count = cluster.getChildCount();
                    var size = count < 10 ? 'small' : count < 100 ? 'medium' : 'large';
                    return L.divIcon({
                        html: '<div><span>' + count + '</span></div>',
                        className: 'marker-cluster marker-cluster-' + size + ' marker-cluster-touch',
                        iconSize: L.point(56, 56)
                    });
                }
            });
        }

        function addHoverEffectToLayers(layers, iconUrl) {
            // On touch screens a tap would leave the marker enlarged
            if (isTouchDevice) return;

            layers.eachLayer(function (layer) {
                layer.on('mouseover', function () {
                    this.setIcon(L.icon({
                        iconUrl: iconUrl,
                        iconSize: [70, 70],
                        iconAnchor: [35, 70],
                        popupAnchor: [0, -50]
                    }));
                });

                layer.on('mouseout', function () {
                    this.setIcon(markerIcon(iconUrl));
                });
            });
        }

        // Create a marker cluster group
        var breweryMarkers = createClusterGroup();
        var venueMarkers = createClusterGroup();

        // Venues are shown first; breweries are built when the layer switch is used
        var venues = L.geoJSON(venues_lst[0], {
            onEachFeature: function (feature, layer) {
                onEachLayer(feature, layer, selectedLayer)},
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: markerIcon('ikony/pub.png')
                });
            }
        });

        addHoverEffectToLayers(venues, "ikony/pub.png");

        // Add the GeoJSON layer to the marker cluster group
        venueMarkers.addLayer(venues);

        // Add the marker cluster group to the map
        map.addLayer(venueMarkers);
        if (!fitMarkersOnSmallScreen(venueMarkers)) {
            // same view as after switching to Venues
            map.setView([50.19243907905966, -19.821782223466816], 3);
        }

        // Phones and tablets: zoom so that all markers / clusters are visible,
        // keeping clear of the layer switch at the top and the Filters button at the bottom
        function fitMarkersOnSmallScreen(markers) {
            if (!isSmallScreen() || markers.getLayers().length === 0) {
                return false;
            }
            map.fitBounds(markers.getBounds(), {
                paddingTopLeft: [30, 80],
                paddingBottomRight: [30, 90],
                animate: false
            });
            return true;
        }
        /*-----------------------------------------------------------------------------------------------------------------------------------------------------------*/
        function getLastDateInMonth(year, month) {
            // Month parameter is 0-indexed in JavaScript (0 for January, 1 for February, etc.)
            const lastDayOfMonth = new Date(year, month, 0);
            return lastDayOfMonth;
        }
        
        // "17/04/2025" -> "17 Apr 2025"
        function formatCheckinDate(dmy) {
            var parts = dmy.split('/');
            var date = new Date(parts[2], parts[1] - 1, parts[0]);
            if (isNaN(date)) return dmy;
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // Full name of a friend from the beer buddy filter, e.g. "FZ" -> "Filip Zadražil"
        function friendName(friendId) {
            var option = document.querySelector('#filter-dropdown option[value="' + friendId + '"]');
            return option ? option.textContent : friendId;
        }

        function displayFriends(friendIds) {
            $('#friends').empty();
            friendIds.forEach(function (friendId) {
                var name = friendName(friendId);
                var friend = $('<div class="friend"></div>').attr('title', name);
                friend.append($('<img class="friend-picture">').attr('src', 'ikony/' + friendId + '.jpg').attr('alt', name));
                friend.append($('<span class="friend-name"></span>').text(name.split(' ')[0]));
                $('#friends').append(friend);
            });
        }

        // Function to update the rating circles
        function updateRatingCircles(rating) {
            // Clear previous circles
            $('#ratingCircles').empty();

            //rating = parseFloat(rating.replace(',', '.'));
            // Define the total number of circles
            var totalCircles = 5;

            // Create and append the circles
            for (var i = 1; i < totalCircles+1; i++) {
                var circle = $('<div class="rating-circle"></div>');
                if (i <= rating) {
                    // Fill the circle
                    circle.addClass('filled');
                } else if (rating % 1 !== 0 && i-rating < 1) {
                    // Partial fill for the last circle
                    var percentage = (rating % 1)*100;
                    circle.css('background', 'conic-gradient(from 180deg, #FFD700 0%, #FFD700 ' + percentage + '%, transparent ' + percentage + '%)');
                }
                $('#ratingCircles').append(circle);
            }
        }
        
        function handleBoxContentClick(e) {
            e.preventDefault();

            // Highlight the beer whose detail is shown
            $('.box-content.active').removeClass('active');
            $(this).addClass('active');

            var splitResult = this.id.split(',');
            var placeName = splitResult[0].replace(/_/g, " ");
            var popupItemIndex = splitResult[1];
            var check_in, breweryName, venueName;
            if (selectedLayer === "Venues") {
                check_in = venue_check_ins[placeName][popupItemIndex];
                breweryName = check_in["Brewery"];
                venueName = placeName;
            } else {
                check_in = brewery_check_ins[placeName][popupItemIndex];
                breweryName = placeName;
                venueName = check_in["Venue"];
            }

            $('#checkinDate').text(formatCheckinDate(check_in["Date"]));
            $('#beerName').text(check_in["Beer"]);
            $('#beerStyle').text(check_in["Beer_style"]);

            // Brewery (with its country) and venue
            var country = check_in["Brewery_country"];
            $('#breweryName').text(breweryName ? breweryName + (country ? ' \u00b7 ' + country : '') : '');
            $('#brewery-div').toggle(!!breweryName);
            $('#venueName').text(venueName || '');
            $('#venue-div').toggle(!!venueName);

            // Venues layer: the beer's way from the brewery to the venue, drawn on request
            prepareRoute(selectedLayer === "Venues" ? check_in : null);

            updateRatingCircles(check_in["Rating"]);
            $('#ratingValue').text(Number(check_in["Rating"]) + ' / 5');

        function onEachFilteredBrewery(feature, layer, filters, layerName) {
            var beerStyle = filters["Beer_style"];
            var servingStyle = filters["Serving_style"];
            var friend = filters["Friend"];
            let minRating = filters["Rating"][0];
            let maxRating = filters["Rating"][1];
            let fromDate = filters["fromDate"];
            let toDate = filters["toDate"];

            if (layerName === "Breweries"){
                var layerId = feature.properties.Brewery;
                var beerList = brewery_check_ins[layerId];
            } else if (layerName === "Venues"){
                var layerId = feature.properties.Venue;
                var beerList = venue_check_ins[layerId];
            }
            var beers = [];
            var beerListLen = beerList.length;

            // Iterate over the list of dictionaries
            for (var i = 0; i < beerListLen; i++) {
                var dict_n = beerList[i];
                const [day, month, year] = dict_n["Date"].split('/');
                const itemDate = new Date(year, month - 1, day); 
                if (friend == 'ALL' || dict_n["Friends"].includes(friend)){
                    if (servingStyle.includes(dict_n["Serving_style"])){
                        var bS;
                        if (dict_n["Beer_style"].includes("Lager") || dict_n["Beer_style"].includes("Pilsner")){
                            bS = "Lager"
                        } else if (dict_n["Beer_style"].includes("Ale")){
                            bS = "Ale"
                        } else if (dict_n["Beer_style"].includes("IPA")){
                            bS = "IPA"
                        } else if (dict_n["Beer_style"].includes("Stout") || dict_n["Beer_style"].includes("Porter")) {
                            bS = "Stout"
                        } else if (dict_n["Beer_style"].includes("Sour")){
                            bS = "Sour"
                        } else {
                            bS = "Other"
                        }
                        let beerStyleCompliance = beerStyle.includes(bS);
                        let minRatingCompliance = parseFloat(dict_n["Rating"]) >= minRating;
                        let maxRatingCompliance = parseFloat(dict_n["Rating"]) <= maxRating;
                        let fromDateCompliance = itemDate >= fromDate;
                        let toDateCompliance = itemDate <= toDate;
                        if (minRatingCompliance && maxRatingCompliance && fromDateCompliance && toDateCompliance && beerStyleCompliance){
                            beers.push({ index: i, name: dict_n['Beer'] });
                        }
                    }
                }
            }

            layer.beerCount = beers.length;
            layer.bindPopup(buildPopupContent(layerId, beers), popupOptions());
        }
        var breweries = L.geoJSON();

        function breweryFilter(feature, layer, filters, layerName) {
            var beerStyle = filters["Beer_style"];
            var servingStyle = filters["Serving_style"];
            var friend = filters["Friend"];
            let minRating = filters["Rating"][0];
            let maxRating = filters["Rating"][1];
            var fromDate = filters["fromDate"];
            var toDate = filters["toDate"];

            if (layerName === "Breweries") {
                var placeName = feature.properties.Brewery;
                var beerList = brewery_check_ins[placeName];
            } else if (layerName === "Venues") {
                var placeName = feature.properties.Venue;
                var beerList = venue_check_ins[placeName];
            }

            var compliesConditions = beerList.some(function (item) {
                let minRatingCompliance = item.Rating >= minRating;
                let maxRatingCompliance = item.Rating <= maxRating;
                let servingCompliance = servingStyle.includes(item.Serving_style);
                let friendCompliance;
                if (friend == "ALL") {
                    friendCompliance = true;
                }
                else {
                    friendCompliance = item.Friends.includes(friend);
                }
                const [day, month, year] = item.Date.split('/');
                const itemDate = new Date(year, month - 1, day);
                let fromDateCompliance = itemDate >= fromDate;
                let toDateCompliance = itemDate <= toDate;

                var bS;
                if (item.Beer_style.includes("Lager") || item.Beer_style.includes("Pilsner")){
                    bS = "Lager"
                } else if (item.Beer_style.includes("Ale")){
                    bS = "Ale"
                } else if (item.Beer_style.includes("IPA")){
                    bS = "IPA"
                } else if (item.Beer_style.includes("Stout") || item.Beer_style.includes("Porter")) {
                    bS = "Stout"
                } else if (item.Beer_style.includes("Sour")){
                    bS = "Sour"
                } else {
                    bS = "Other"
                }

                let beerStyleCompliance = beerStyle.includes(bS);

                if (friend == "ALL") {
                    return (
                        servingCompliance &&
                        minRatingCompliance &&
                        maxRatingCompliance &&
                        fromDateCompliance &&
                        toDateCompliance &&
                        beerStyleCompliance
                    );
                } else {
                    return (
                        servingCompliance &&
                        friendCompliance &&
                        minRatingCompliance &&
                        maxRatingCompliance &&
                        fromDateCompliance &&
                        toDateCompliance &&
                        beerStyleCompliance
                    );
                }
            });

            return compliesConditions;
        }

        // Move an opened popup to the middle of the free map area (between the map controls),
        // so that it is always fully visible
        function centerPopup(popup) {
            var popupElement = popup.getElement();
            if (!popupElement) return;

            var mapRect = map.getContainer().getBoundingClientRect();
            var top = mapRect.top;
            var bottom = mapRect.bottom;
            map.getContainer().querySelectorAll('.leaflet-top .leaflet-control').forEach(function (control) {
                top = Math.max(top, control.getBoundingClientRect().bottom);
            });
            var bottomControls = Array.from(map.getContainer().querySelectorAll('.leaflet-bottom .leaflet-control:not(.leaflet-control-attribution)'));
            if (filtersToggle.offsetParent) {
                bottomControls.push(filtersToggle);
            }
            bottomControls.forEach(function (control) {
                bottom = Math.min(bottom, control.getBoundingClientRect().top);
            });

            var popupRect = popupElement.getBoundingClientRect();
            var objectTop = popupRect.top;
            var objectBottom = popupRect.bottom;

            // Larger screens: centre the popup together with its marker icon below it
            var marker = popup._source;
            var icon = marker && marker.getElement ? marker.getElement() : null;
            if (!isSmallScreen() && icon) {
                objectBottom = Math.max(objectBottom, icon.getBoundingClientRect().bottom);
            }

            var dx = (popupRect.left + popupRect.right) / 2 - (mapRect.left + mapRect.right) / 2;
            var dy = (objectTop + objectBottom) / 2 - (top + bottom) / 2;
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                map.panBy([dx, dy]);
            }
        }

            });
        });

        // Route from the brewery to the venue (Venues layer, on request from the detail panel)

        // "50.08, 14.42" -> L.latLng
        function parseLatLng(text) {
            if (!text) return null;
            var parts = String(text).split(',');
            var latlng = L.latLng(parseFloat(parts[0]), parseFloat(parts[1]));
            return isNaN(latlng.lat) || isNaN(latlng.lng) ? null : latlng;
        }

        function formatDistance(meters) {
            var km = meters / 1000;
            return (km < 10 ? km.toFixed(1) : Math.round(km).toLocaleString('en-GB')) + ' km';
        }

        // Points of a gentle arc between two places (a straight line would hide in the map)
        function arcPoints(from, to) {
            var dLat = to.lat - from.lat;
            var dLng = to.lng - from.lng;
            // bend sideways by a fifth of the distance
            var control = L.latLng(from.lat + dLat / 2 - dLng * 0.2, from.lng + dLng / 2 + dLat * 0.2);
            var points = [];
            for (var i = 0; i <= 64; i++) {
                var t = i / 64;
                var a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
                points.push([
                    a * from.lat + b * control.lat + c * to.lat,
                    a * from.lng + b * control.lng + c * to.lng
                ]);
            }
            return points;
        }

        // Called for every opened check-in: set up the button (or the "brewed here" note)
        function prepareRoute(checkIn) {
            clearRoute();
            routeCheckIn = null;
            routeReturn = null;
            $('#route-div').hide();
            if (!checkIn) return;

            var brewery = parseLatLng(checkIn["Brewery_location"]);
            var venue = parseLatLng(checkIn["Venue_location"]);
            if (!brewery || !venue) return;

            $('#route-div').show();
            var distance = map.distance(brewery, venue);
            if (distance < 100) {
                // brewpub: the beer did not travel anywhere
                $('#route-toggle').hide();
                $('#route-note').show();
                return;
            }
            routeCheckIn = checkIn;
            routeDistance = distance;
            $('#route-note').hide();
            $('#route-toggle').show();
            updateRouteButton();
        }

        function updateRouteButton() {
            var shown = !!routeLayer;
            $('#route-toggle').attr('aria-pressed', shown).toggleClass('active', shown);
            $('#route-label').text((shown ? 'Hide route' : 'Show route from brewery') +
                (routeCheckIn ? ' \u00b7 ' + formatDistance(routeDistance) : ''));
        }

        function showRoute() {
            if (!routeCheckIn) return;
            var brewery = parseLatLng(routeCheckIn["Brewery_location"]);
            var venue = parseLatLng(routeCheckIn["Venue_location"]);
            var points = arcPoints(brewery, venue);

            var breweryLabel = routeCheckIn["Brewery"];
            var venueLabel = venueOfRoute();
            // Name labels centred above the icons
            var iconSize = isSmallScreen() ? 66 : 50;
            var labelOptions = { permanent: true, direction: 'top', offset: [0, -iconSize], className: 'route-tooltip' };
            routeLayer = L.layerGroup([
                L.polyline(points, { color: 'white', weight: 7, opacity: 0.85, interactive: false }),
                L.polyline(points, { color: 'rgb(165, 42, 42)', weight: 3, dashArray: '8 7', interactive: false }),
                L.marker(venue, { icon: markerIcon('ikony/pub.png'), interactive: false }).bindTooltip(venueLabel, labelOptions),
                L.marker(brewery, { icon: markerIcon('ikony/beer.png'), interactive: false }).bindTooltip(breweryLabel, labelOptions)
            ]).addTo(map);

            // Each map edge only needs room for half of the label of the place on that side
            var venueIsWest = venue.lng <= brewery.lng;
            var westLabel = venueIsWest ? venueLabel : breweryLabel;
            var eastLabel = venueIsWest ? breweryLabel : venueLabel;

            routeReturn = {
                center: map.getCenter(),
                zoom: map.getZoom(),
                marker: map.hasLayer(lastPopupMarker) && lastPopupMarker.isPopupOpen() ? lastPopupMarker : null,
                beerId: $('.box-content.active').attr('id')
            };

            // Only the venue and the brewery stay on the map; the popup would cover the route
            map.closePopup();
            hidePlaces();
            // Phones: the map gets almost the whole screen, the sheet waits at the bottom
            if (isSmallScreen() && contentBox.classList.contains('open')) {
                setSheetState('peek');
            }
            fitRoute(L.latLngBounds(points), iconSize, labelWidth(westLabel) / 2, labelWidth(eastLabel) / 2);
            updateRouteButton();
        }

        // Width of a route label, so the map can leave room for it
        function labelWidth(text) {
            var label = L.DomUtil.create('div', 'leaflet-tooltip route-tooltip', document.body);
            label.style.visibility = 'hidden';
            label.textContent = text;
            var width = label.offsetWidth;
            document.body.removeChild(label);
            return width;
        }

        // Fit the whole route, including the icons with their labels above them,
        // into the free part of the map (above the detail sheet on phones)
        function fitRoute(bounds, iconSize, westRoom, eastRoom) {
            var leftPadding = Math.max(iconSize / 2, westRoom) + 10;
            var rightPadding = Math.max(iconSize / 2, eastRoom) + 10;
            var topPadding = iconSize + 50 + 60; // icon + label (up to two lines) + layer switch
            var bottomPadding = 60;
            if (isSmallScreen() && contentBox.classList.contains('open')) {
                // the sheet may still be sliding, so use its final height
                var sheetHeight = contentBox.classList.contains('peek') ? SHEET_PEEK_HEIGHT : contentBox.offsetHeight;
                bottomPadding = sheetHeight + 30;
            }
            map.fitBounds(bounds, {
                paddingTopLeft: [leftPadding, topPadding],
                paddingBottomRight: [rightPadding, bottomPadding],
                maxZoom: 15
            });
        }

        // Places on the map are clusters, or plain dots while the timeline is open
        function hidePlaces() {
            map.removeLayer(activeMarkers());
            map.removeLayer(timeline.dotLayer);
        }

        function showPlaces() {
            if (timeline.active) {
                map.addLayer(timeline.dotLayer);
            } else if (!map.hasLayer(activeMarkers())) {
                map.addLayer(activeMarkers());
            }
        }

        function clearRoute() {
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
                // bring back the places hidden while the route was shown
                showPlaces();
            }
            updateRouteButton();
        }

        // "Hide route": back to the venue with its popup open and the beer still highlighted,
        // so the next beer's route is one tap away
        function returnFromRoute() {
            var back = routeReturn;
            routeReturn = null;
            if (!back) return;

            map.setView(back.center, back.zoom, { animate: false });
            if (!back.marker) return;

            function reopen(marker) {
                keepViewOnNextPopup = true;
                marker.openPopup();
                var beer = back.beerId ? document.getElementById(back.beerId) : null;
                if (beer) {
                    beer.classList.add('active');
                }
            }

            if (timeline.active) {
                var dot = timeline.dotByName[placeName(back.marker)];
                if (dot) reopen(dot);
                return;
            }

            // Filters changed meanwhile rebuild the markers: find the same place among the new ones
            var markers = activeMarkers();
            var marker = back.marker;
            if (!markers.hasLayer(marker)) {
                var key = selectedLayer === "Venues" ? "Venue" : "Brewery";
                var name = marker.feature.properties[key];
                marker = markers.getLayers().find(function (layer) {
                    return layer.feature.properties[key] === name;
                });
                if (!marker) return;
            }

            markers.zoomToShowLayer(marker, function () {
                reopen(marker);
            });
        }

        document.getElementById('route-toggle').addEventListener('click', function () {
            if (routeLayer) {
                clearRoute();
                if (contentBox.classList.contains('peek')) {
                    setSheetState('half');
                }
                returnFromRoute();
            } else {
                showRoute();
            }
        });

        // Opening another place hides the route of the previous beer
        map.on('popupopen', function () {
            if (routeLayer) clearRoute();
        });
        /*-----------------------------------------------------------------------------------------------------------------------------------------------------------*/
        // Search: venues, breweries and beers; matches anywhere in the name, words in any order,
        // ignores diacritics and tolerates small typos
        var SEARCH_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>';
        var BEER_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l-1.6 16.5A2 2 0 0 1 14.4 21H9.6a2 2 0 0 1-2-1.5z"/></svg>';
        var RESULTS_PER_GROUP = 5;

        // One normalised character per original character, so matches can be highlighted
        function normalizeChar(ch) {
            var plain = ch.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            return plain.length === 1 ? plain : (ch.toLowerCase().charAt(0) || ' ');
        }

        function normalizeText(text) {
            return Array.from(text).map(normalizeChar).join('');
        }

        // Typos: optimal string alignment distance (insert, delete, replace, swap neighbours)
        function editDistance(a, b) {
            var d = [];
            for (var i = 0; i <= a.length; i++) {
                d.push([i]);
            }
            for (var j = 1; j <= b.length; j++) {
                d[0][j] = j;
            }
            for (i = 1; i <= a.length; i++) {
                for (j = 1; j <= b.length; j++) {
                    var cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
                    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
                        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
                    }
                }
            }
            return d[a.length][b.length];
        }

        // Everything that can be found, built once from the check-in data
        var searchItems = (function () {
            var items = [];
            var venueOfCheckIn = {};
            Object.keys(venue_check_ins).forEach(function (venue) {
                var list = venue_check_ins[venue];
                items.push({ type: 'venue', name: venue, beers: list.length });
                list.forEach(function (checkIn, index) {
                    venueOfCheckIn[checkIn["ID"]] = { venue: venue, index: index };
                });
            });
            var seenBeers = {};
            Object.keys(brewery_check_ins).forEach(function (brewery) {
                var list = brewery_check_ins[brewery];
                items.push({ type: 'brewery', name: brewery, beers: list.length, country: list[0] && list[0]["Brewery_country"] });
                list.forEach(function (checkIn, index) {
                    var venue = venueOfCheckIn[checkIn["ID"]] || {};
                    var key = checkIn["Beer"] + '|' + brewery + '|' + venue.venue;
                    if (seenBeers[key]) return; // the same beer at the same place only once
                    seenBeers[key] = true;
                    items.push({
                        type: 'beer', name: checkIn["Beer"], date: checkIn["Date"],
                        brewery: brewery, breweryIndex: index,
                        venue: venue.venue, venueIndex: venue.index
                    });
                });
            });
            items.forEach(function (item) {
                item.norm = normalizeText(item.name);
                item.words = item.norm.split(/[^a-z0-9]+/).filter(Boolean);
            });
            return items;
        })();

        // Lower score = better: 0 name starts with the query, 1 a word starts with it,
        // 2 inside a word, 3+ only with typos. Returns null when a word of the query is not found.
        function matchSearchItem(item, query, tokens) {
            var score = 0;
            var ranges = [];
            for (var t = 0; t < tokens.length; t++) {
                var token = tokens[t];
                var pos = item.norm.indexOf(token);
                if (pos >= 0) {
                    var tokenScore = 2, matchAt = pos;
                    for (var p = pos; p >= 0; p = item.norm.indexOf(token, p + 1)) {
                        if (p === 0 || !/[a-z0-9]/.test(item.norm[p - 1])) {
                            tokenScore = p === 0 ? 0 : 1;
                            matchAt = p;
                            break;
                        }
                    }
                    ranges.push([matchAt, matchAt + token.length]);
                    score = Math.max(score, tokenScore);
                } else {
                    var maxTypos = token.length >= 7 ? 2 : token.length >= 4 ? 1 : 0;
                    if (!maxTypos) return null;
                    var best = Infinity;
                    item.words.forEach(function (word) {
                        best = Math.min(best, editDistance(token, word), editDistance(token, word.slice(0, token.length)));
                    });
                    if (best > maxTypos) return null;
                    score = Math.max(score, 2 + best);
                }
            }
            // the whole query at the start of the name always ranks first
            if (item.norm.indexOf(query) === 0) score = 0;
            return { item: item, score: score, ranges: ranges };
        }

        function searchPlaces(text) {
            var query = normalizeText(text.trim());
            var tokens = query.split(/[^a-z0-9]+/).filter(Boolean);
            if (!tokens.length) return [];
            var matches = [];
            searchItems.forEach(function (item) {
                var match = matchSearchItem(item, query, tokens);
                if (match) matches.push(match);
            });
            matches.sort(function (a, b) {
                return a.score - b.score || a.item.name.length - b.item.name.length;
            });
            // best results of every group, groups in a fixed order
            var results = [];
            ['venue', 'brewery', 'beer'].forEach(function (type) {
                results = results.concat(matches.filter(function (m) {
                    return m.item.type === type;
                }).slice(0, RESULTS_PER_GROUP));
            });
            return results;
        }

        // Name with the matched parts in <mark>
        function highlightedName(name, ranges) {
            var chars = Array.from(name);
            var marked = chars.map(function () { return false; });
            ranges.forEach(function (range) {
                for (var i = range[0]; i < range[1] && i < chars.length; i++) marked[i] = true;
            });
            var fragment = document.createDocumentFragment();
            var i = 0;
            while (i < chars.length) {
                var j = i;
                while (j < chars.length && marked[j] === marked[i]) j++;
                var text = document.createTextNode(chars.slice(i, j).join(''));
                if (marked[i]) {
                    var mark = document.createElement('mark');
                    mark.appendChild(text);
                    fragment.appendChild(mark);
                } else {
                    fragment.appendChild(text);
                }
                i = j;
            }
            return fragment;
        }

        function resultDetail(item) {
            var beers = item.beers + (item.beers === 1 ? ' beer' : ' beers');
            if (item.type === 'venue') return 'Venue \u00b7 ' + beers;
            if (item.type === 'brewery') return 'Brewery \u00b7 ' + (item.country ? item.country + ' \u00b7 ' : '') + beers;
            return item.brewery + (item.venue ? ' \u00b7 ' + item.venue : '') + ' \u00b7 ' + formatCheckinDate(item.date);
        }

        var searchResults = [];
        var searchActive = -1;

        function renderSearchResults() {
            var input = document.getElementById('search-input');
            var list = document.getElementById('search-results');
            searchResults = searchPlaces(input.value);
            searchActive = searchResults.length ? 0 : -1;
            list.innerHTML = '';

            if (!input.value.trim()) {
                list.hidden = true;
                input.setAttribute('aria-expanded', 'false');
                return;
            }
            if (!searchResults.length) {
                var empty = document.createElement('li');
                empty.className = 'search-empty';
                empty.textContent = 'No matches';
                list.appendChild(empty);
            }

            var titles = { venue: 'Venues', brewery: 'Breweries', beer: 'Beers' };
            var lastType = null;
            searchResults.forEach(function (match, index) {
                var item = match.item;
                if (item.type !== lastType) {
                    var group = document.createElement('li');
                    group.className = 'search-group';
                    group.setAttribute('role', 'presentation');
                    group.textContent = titles[item.type];
                    list.appendChild(group);
                    lastType = item.type;
                }
                var row = document.createElement('li');
                row.className = 'search-result' + (index === searchActive ? ' active' : '');
                row.id = 'search-result-' + index;
                row.setAttribute('role', 'option');
                row.innerHTML = item.type === 'venue' ? '<img src="ikony/pub.png" alt="">' :
                                item.type === 'brewery' ? '<img src="ikony/beer.png" alt="">' : BEER_ICON;
                var text = document.createElement('span');
                text.className = 'search-result-text';
                var name = document.createElement('span');
                name.className = 'search-result-name';
                name.appendChild(highlightedName(item.name, match.ranges));
                var detail = document.createElement('span');
                detail.className = 'search-result-detail';
                detail.textContent = resultDetail(item);
                text.appendChild(name);
                text.appendChild(detail);
                row.appendChild(text);
                row.addEventListener('click', function () {
                    selectSearchResult(item);
                });
                list.appendChild(row);
            });
            list.hidden = false;
            input.setAttribute('aria-expanded', 'true');
            input.setAttribute('aria-activedescendant', searchActive >= 0 ? 'search-result-' + searchActive : '');
        }

        function moveSearchSelection(step) {
            if (!searchResults.length) return;
            searchActive = (searchActive + step + searchResults.length) % searchResults.length;
            document.querySelectorAll('.search-result').forEach(function (row, index) {
                row.classList.toggle('active', index === searchActive);
                if (index === searchActive) row.scrollIntoView({ block: 'nearest' });
            });
            document.getElementById('search-input').setAttribute('aria-activedescendant', 'search-result-' + searchActive);
        }

        function showMapToast(text) {
            var toast = document.getElementById('map-toast');
            toast.textContent = text;
            toast.hidden = false;
            clearTimeout(showMapToast.timer);
            showMapToast.timer = setTimeout(function () {
                toast.hidden = true;
            }, 3500);
        }

        function findPlaceMarker(name) {
            return activeMarkers().getLayers().find(function (marker) {
                return placeName(marker) === name;
            });
        }

        // Show the found place: right layer, everything that could hide it switched off,
        // zoom in, open its popup (and for a beer also its check-in detail)
        function selectSearchResult(item) {
            closeSearch();
            var layer = item.type === 'venue' ? 'Venues' :
                        item.type === 'brewery' ? 'Breweries' :
                        selectedLayer;
            var place = item.type === 'beer' ? (layer === 'Venues' ? item.venue : item.brewery) : item.name;
            var beerIndex = item.type === 'beer' ? (layer === 'Venues' ? item.venueIndex : item.breweryIndex) : null;

            var notes = [];
            if (timeline.active) {
                closeTimeline();
                notes.push('Timeline closed');
            }
            if (routeLayer) {
                clearRoute();
            }
            if (selectedLayer !== layer) {
                keepViewOnLayerSwitch = true;
                document.querySelector('.overlay-switch input[value="' + layer + '"]').click();
                keepViewOnLayerSwitch = false;
            }
            var marker = findPlaceMarker(place);
            if (!marker) {
                resetFiltersQuietly();
                runFilters();
                marker = findPlaceMarker(place);
                notes.push('Filters reset');
            }
            if (!marker) return;
            if (notes.length) {
                showMapToast(notes.join(' and ') + ' to show \u201c' + place + '\u201d');
            }

            map.setView(marker.getLatLng(), Math.max(map.getZoom(), 15), { animate: false });
            activeMarkers().zoomToShowLayer(marker, function () {
                marker.openPopup();
                if (beerIndex !== null) {
                    var beer = document.getElementById(place.replace(/ /g, '_') + ',' + beerIndex);
                    if (beer) beer.click();
                }
            });
        }

        function openSearch() {
            document.getElementById('map-search').hidden = false;
            searchControl.getContainer().classList.add('active');
            var input = document.getElementById('search-input');
            input.focus();
            input.select();
            renderSearchResults();
        }

        function closeSearch() {
            document.getElementById('map-search').hidden = true;
            searchControl.getContainer().classList.remove('active');
            document.getElementById('search-input').blur();
        }

        // Search button on the map (top left)
        var searchControl = L.control({ position: 'topleft' });
        searchControl.onAdd = function () {
            var button = L.DomUtil.create('button', 'search-toggle');
            button.type = 'button';
            button.innerHTML = SEARCH_ICON;
            button.setAttribute('aria-label', 'Search venues, breweries and beers');
            L.DomEvent.disableClickPropagation(button);
            L.DomEvent.on(button, 'click', function () {
                if (document.getElementById('map-search').hidden) {
                    openSearch();
                } else {
                    closeSearch();
                }
            });
            return button;
        };
        searchControl.addTo(map);

        var searchTimer = null;
        document.getElementById('search-input').addEventListener('input', function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderSearchResults, 100);
        });
        document.getElementById('search-input').addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                moveSearchSelection(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                moveSearchSelection(-1);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                clearTimeout(searchTimer);
                renderSearchResults();
                if (searchResults[searchActive]) selectSearchResult(searchResults[searchActive].item);
            } else if (e.key === 'Escape') {
                e.stopPropagation();
                closeSearch();
            }
        });
        document.getElementById('search-close').addEventListener('click', closeSearch);
        map.on('click', closeSearch);

        /*-----------------------------------------------------------------------------------------------------------------------------------------------------------*/
        // Timeline: replays month by month how venues / breweries were added to the map
        var PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
        var PAUSE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

        // "28/11/2023" -> Date
        function parseCheckinDate(dmy) {
            var parts = dmy.split('/');
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        // First day of every month from the first to the last check-in
        var timelineMonths = (function () {
            var first = null, last = null;
            Object.keys(brewery_check_ins).forEach(function (brewery) {
                brewery_check_ins[brewery].forEach(function (checkIn) {
                    var date = parseCheckinDate(checkIn["Date"]);
                    if (!first || date < first) first = date;
                    if (!last || date > last) last = date;
                });
            });
            var months = [];
            var month = new Date(first.getFullYear(), first.getMonth(), 1);
            while (month <= last) {
                months.push(new Date(month));
                month.setMonth(month.getMonth() + 1);
            }
            return months;
        })();

        var timeline = {
            active: false,
            index: timelineMonths.length - 1,
            timer: null,
            shownPlaces: null,          // names shown in the previous step, to find the new ones
            pulseLayer: L.layerGroup(), // short highlight of places added in the current month
            dotLayer: L.featureGroup(), // places as dots instead of clusters
            dotByName: {}
        };

        // Dots are drawn on a canvas; the tolerance makes small dots easy to tap
        var timelineRenderer = L.canvas({ padding: 0.5, tolerance: 10 });

        // Dot grows with the number of beers at the place up to the timeline month
        function dotRadius(beerCount) {
            return Math.min(18, 4 + 1.6 * Math.sqrt(beerCount || 1));
        }

        // Index -1 is the month before the first check-in: the empty map the timeline starts from
        var TIMELINE_START = -1;

        function timelineMonth(index) {
            var first = timelineMonths[0];
            return new Date(first.getFullYear(), first.getMonth() + index, 1);
        }

        function timelineMonthEnd(index) {
            var month = timelineMonth(index);
            return new Date(month.getFullYear(), month.getMonth() + 1, 0, 23, 59, 59);
        }

        // While the timeline is open, nothing after its current month is shown
        function capFiltersToTimeline(filters) {
            if (timeline.active) {
                var end = timelineMonthEnd(timeline.index);
                if (filters["toDate"] > end) {
                    filters["toDate"] = end;
                }
            }
            return filters;
        }

        function placeName(marker) {
            return marker.feature.properties[selectedLayer === "Venues" ? "Venue" : "Brewery"];
        }

        function renderTimelineStep(highlightNew) {
            runFilters(highlightNew);
        }

        // Month, number of places and the pulse of places added since the previous step
        function updateTimelineInfo(highlightNew) {
            var names = new Set();
            var newPlaces = [];
            activeMarkers().getLayers().forEach(function (marker) {
                var name = placeName(marker);
                names.add(name);
                if (timeline.shownPlaces && !timeline.shownPlaces.has(name)) {
                    newPlaces.push(marker);
                }
            });
            timeline.shownPlaces = names;
            drawTimelineDots(highlightNew ? newPlaces : []);

            timeline.pulseLayer.clearLayers();
            if (highlightNew) {
                newPlaces.forEach(function (marker) {
                    L.marker(marker.getLatLng(), {
                        icon: L.divIcon({ className: 'timeline-pulse', html: '<span></span>', iconSize: [28, 28] }),
                        interactive: false,
                        keyboard: false,
                        zIndexOffset: 1000
                    }).addTo(timeline.pulseLayer);
                });
            }

            var noun = selectedLayer === "Venues" ? (names.size === 1 ? "venue" : "venues") : (names.size === 1 ? "brewery" : "breweries");
            document.getElementById('timeline-date').textContent =
                timelineMonth(timeline.index).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
            document.getElementById('timeline-count').textContent =
                names.size + ' ' + noun + (highlightNew && newPlaces.length ? ' \u00b7 +' + newPlaces.length + ' new' : '');
            document.getElementById('timeline-range').value = timeline.index;
        }

        // Every place as a dot: brown, places new in this month red and slightly bigger
        function drawTimelineDots(newPlaces) {
            var isNew = new Set(newPlaces);
            var markers = activeMarkers().getLayers().slice();
            // big dots first, new ones last, so small and new dots stay on top
            markers.sort(function (a, b) {
                return (isNew.has(a) - isNew.has(b)) || ((b.beerCount || 1) - (a.beerCount || 1));
            });

            timeline.dotLayer.clearLayers();
            timeline.dotByName = {};
            markers.forEach(function (marker) {
                var fresh = isNew.has(marker);
                var dot = L.circleMarker(marker.getLatLng(), {
                    renderer: timelineRenderer,
                    radius: dotRadius(marker.beerCount) + (fresh ? 2 : 0),
                    color: 'white',
                    weight: 1.5,
                    fillColor: fresh ? 'rgb(165, 42, 42)' : 'rgb(87, 62, 62)',
                    fillOpacity: 0.9
                });
                dot.feature = marker.feature;
                dot.bindPopup(marker.getPopup().getContent(), popupOptions());
                dot.addTo(timeline.dotLayer);
                timeline.dotByName[placeName(marker)] = dot;
            });

            if (!routeLayer && !map.hasLayer(timeline.dotLayer)) {
                map.addLayer(timeline.dotLayer);
            }
        }

        function setTimelinePlaying(playing) {
            clearInterval(timeline.timer);
            timeline.timer = null;
            var button = document.getElementById('timeline-play');
            button.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
            button.setAttribute('aria-label', playing ? 'Pause' : 'Play');
            if (!playing) return;

            timeline.timer = setInterval(function () {
                if (timeline.index >= timelineMonths.length - 1) {
                    setTimelinePlaying(false);
                    return;
                }
                timeline.index++;
                renderTimelineStep(true);
            }, 700);
        }

        function playTimeline() {
            // at the end: start again from the empty map
            if (timeline.index >= timelineMonths.length - 1) {
                timeline.index = TIMELINE_START;
                timeline.shownPlaces = null;
                renderTimelineStep(false);
            }
            setTimelinePlaying(true);
        }

        function openTimeline() {
            timeline.active = true;
            timeline.index = TIMELINE_START; // no places until the playback adds them
            timeline.shownPlaces = null;
            document.getElementById('timeline-bar').hidden = false;
            document.body.classList.add('timeline-on');
            timelineControl.getContainer().classList.add('active');
            timeline.pulseLayer.addTo(map);
            renderTimelineStep(false);
            playTimeline();
        }

        function closeTimeline() {
            setTimelinePlaying(false);
            timeline.active = false;
            timeline.shownPlaces = null;
            timeline.pulseLayer.clearLayers();
            map.removeLayer(timeline.pulseLayer);
            timeline.dotLayer.clearLayers();
            timeline.dotByName = {};
            map.removeLayer(timeline.dotLayer);
            if (routeLayer) {
                // a route drawn over the dots ends with the timeline
                map.removeLayer(routeLayer);
                routeLayer = null;
                routeReturn = null;
                updateRouteButton();
            }
            document.getElementById('timeline-bar').hidden = true;
            document.body.classList.remove('timeline-on');
            timelineControl.getContainer().classList.remove('active');
            runFilters(); // everything again
        }

        // "Timeline" button on the map (top left, below the zoom buttons on larger screens)
        var timelineControl = L.control({ position: 'topleft' });
        timelineControl.onAdd = function () {
            var button = L.DomUtil.create('button', 'timeline-toggle');
            button.type = 'button';
            button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Timeline</span>';
            L.DomEvent.disableClickPropagation(button);
            L.DomEvent.on(button, 'click', function () {
                if (timeline.active) {
                    closeTimeline();
                } else {
                    openTimeline();
                }
            });
            return button;
        };
        timelineControl.addTo(map);

        document.getElementById('timeline-range').min = TIMELINE_START;
        document.getElementById('timeline-range').max = timelineMonths.length - 1;
        document.getElementById('timeline-play').addEventListener('click', function () {
            if (timeline.timer) {
                setTimelinePlaying(false);
            } else {
                playTimeline();
            }
        });
        document.getElementById('timeline-range').addEventListener('input', function () {
            setTimelinePlaying(false);
            timeline.index = parseInt(this.value);
            renderTimelineStep(false);
        });
        document.getElementById('timeline-close').addEventListener('click', closeTimeline);
        // Rating slider: two range inputs over one track, values shown as 0.25–5
        function initRatingSlider() {
            var slider = document.getElementById('slider-distance');
            var inputs = slider.querySelectorAll('input[type="range"]');
            var minInput = inputs[0];
            var maxInput = inputs[1];
            var inverseLeft = slider.querySelector('[inverse-left]');
            var inverseRight = slider.querySelector('[inverse-right]');
            var range = slider.querySelector('[range]');
            var thumbs = slider.querySelectorAll('[thumb]');
            var signs = slider.querySelectorAll('[sign]');
            var step = parseInt(minInput.step);

            function toPercent(input) {
                var min = parseInt(input.min);
                var max = parseInt(input.max);
                return (parseInt(input.value) - min) / (max - min) * 100;
            }

            function update(e) {
                // Keep the minimum below the maximum
                if (e && e.target === minInput) {
                    minInput.value = Math.min(minInput.value, maxInput.value - step);
                } else if (e && e.target === maxInput) {
                    maxInput.value = Math.max(maxInput.value, parseInt(minInput.value) + step);
                }

                var left = toPercent(minInput);
                var right = toPercent(maxInput);

                inverseLeft.style.width = left + '%';
                inverseRight.style.width = (100 - right) + '%';
                range.style.left = left + '%';
                range.style.right = (100 - right) + '%';
                thumbs[0].style.left = left + '%';
                thumbs[1].style.left = right + '%';
                signs[0].style.left = left + '%';
                signs[1].style.left = right + '%';
                document.getElementById('min-value').textContent = minInput.value / 100;
                document.getElementById('max-value').textContent = maxInput.value / 100;
            }

            minInput.addEventListener('input', update);
            maxInput.addEventListener('input', update);
            update();
        }

        initRatingSlider();
        updateResultCount(venueMarkers.getLayers().length);

        // Filters drawer (small screens)
        var filterPanel = document.getElementById('filter-panel');
        var filtersToggle = document.getElementById('filters-toggle');
        var panelBackdrop = document.getElementById('panel-backdrop');

        function setFiltersOpen(open) {
            filterPanel.classList.toggle('open', open);
            filtersToggle.setAttribute('aria-expanded', open);
            panelBackdrop.hidden = !open;
        }

        filtersToggle.addEventListener('click', function () {
            setFiltersOpen(true);
        });
        document.getElementById('filters-close').addEventListener('click', function () {
            setFiltersOpen(false);
        });
        panelBackdrop.addEventListener('click', function () {
            setFiltersOpen(false);
        });

        // Check-in detail bottom sheet (small screens)
        var contentBox = document.getElementById('contentBox');

        // States of the bottom sheet: closed, half (class "open") and full screen (classes "open full")
        // Height of the tucked-away sheet: the handle and the beer name stay visible
        var SHEET_PEEK_HEIGHT = 92;

        // Open sheet sizes on phones: 'peek' (tucked away), 'half' or 'full' screen
        function setSheetState(state) {
            contentBox.classList.toggle('peek', state === 'peek');
            contentBox.classList.toggle('full', state === 'full');
            // the map buttons at the bottom move up above the tucked-away sheet
            document.body.classList.toggle('sheet-peek', state === 'peek');
            if (state === 'peek') {
                contentBox.scrollTop = 0;
            }
        }

        // The map does not move when the sheet opens: the popup stays centred,
        // so it is still in the middle of the screen after the sheet is closed
        function setDetailOpen(open) {
            contentBox.classList.toggle('open', open && isSmallScreen());
            if (!open) {
                contentBox.classList.remove('full', 'peek');
                document.body.classList.remove('sheet-peek');
                // closing the detail also hides its route and brings back all places
                if (routeLayer) {
                    clearRoute();
                    routeReturn = null;
                }
                // The detail is gone, so the beer in the popup is no longer highlighted
                if (isSmallScreen()) {
                    $('.box-content.active').removeClass('active');
                }
            }
        }

        document.getElementById('detail-close').addEventListener('click', function () {
            setDetailOpen(false);
        });

        // Drag the handle up to expand the sheet to full screen, down to shrink or close it
        (function initSheetDrag() {
            var handle = document.getElementById('sheet-handle');
            var startY = null;
            var startHeight = 0;
            var height = 0;

            handle.addEventListener('pointerdown', function (e) {
                if (e.target.closest('button')) return; // the close button is inside the handle
                startY = e.clientY;
                startHeight = height = contentBox.offsetHeight;
                contentBox.classList.add('dragging');
                handle.setPointerCapture(e.pointerId);
            });

            handle.addEventListener('pointermove', function (e) {
                if (startY === null) return;
                height = Math.max(0, Math.min(window.innerHeight, startHeight - (e.clientY - startY)));
                contentBox.style.height = height + 'px';
            });

            function endDrag() {
                if (startY === null) return;
                var moved = Math.abs(height - startHeight);
                startY = null;
                contentBox.classList.remove('dragging');
                contentBox.style.height = '';

                if (moved < 5) {
                    // A tap on the handle: tucked away -> half, otherwise half <-> full screen
                    if (contentBox.classList.contains('peek')) {
                        setSheetState('half');
                    } else {
                        setSheetState(contentBox.classList.contains('full') ? 'half' : 'full');
                    }
                } else if (height > window.innerHeight * 0.75) {
                    setSheetState('full');
                } else if (height > window.innerHeight * 0.3) {
                    setSheetState('half');
                } else if (routeLayer && height > SHEET_PEEK_HEIGHT * 0.6) {
                    // while a route is shown the sheet can stay tucked away at the bottom
                    setSheetState('peek');
                } else {
                    setDetailOpen(false);
                }
            }

            handle.addEventListener('pointerup', endDrag);
            handle.addEventListener('pointercancel', endDrag);
        })();

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                setFiltersOpen(false);
                setDetailOpen(false);
            }
        });
    </script>
</body>
